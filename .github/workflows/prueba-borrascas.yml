# TEMPORAL: prueba con datos reales en la rama de desarrollo (se borra antes del PR)
name: Prueba borrascas (rama)
on:
  push:
    branches: [borrascas-v2-satelite]
permissions:
  contents: write
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy requests eccodes
      - name: Ejecutar (datos reales)
        run: |
          rm -rf docs/datos_borrascas
          cat > /tmp/cfg.json <<'J'
          {"prueba": {"name": "Prueba (baja 973 hPa)", "active": true,
            "seed": {"time": "2026-11-10T00:00Z", "lat": 46.2, "lon": -18.8},
            "domain": [15, 60, -50, 10], "max_lead_h": 120, "keep_runs": 3,
            "models": ["ECMWF", "ECMWF-ENS", "AIFS", "GFS", "GEFS"]}}
          J
          time python src/trayectorias.py --config /tmp/cfg.json --minutos 28 --out /tmp/out --models GFS,GEFS,ECMWF 2>&1 | grep -v "DEBUG.*Starting new\\|DEBUG.*connectionpool" | tee /tmp/log.txt
      - name: Resumen
        if: always()
        run: |
          python - <<'PY'
          import json, glob
          for f in glob.glob('/tmp/out/*/index.json'):
              i = json.load(open(f))
              print(f, 'observed:', [(o['t'], o['lat'], o['lon'], o['p']) for o in i['observed']])
              for r in i['runs']:
                  d = json.load(open(f.replace('index.json', r['file'])))
                  print(r['id'], {k: (m['found'], m['total'], m['members'][0]['track'][:1], m['members'][0]['track'][-1:]) for k, m in d['models'].items()})
          PY
      - name: Comprobar EUMETView (WMS y CORS)
        if: always()
        run: |
          T=$(date -u -d '-40 min' +%Y-%m-%dT%H:%M:00Z)
          for L in mtg_fd:rgb_geocolour mtg_fd:vis06_hrfi mtg_fd:ir105_hrfi msg_fes:wv062 msg_fes:rgb_airmass mtg_fd:rgb_dust mtg_fd:rgb_firetemperature mtg_fd:frp backgrounds:ne_10m_coastline; do
            curl -s -o /tmp/w.png -w "$L %{http_code} %{content_type} %{size_download}B %{time_total}s\n" \
              "https://view.eumetsat.int/geoserver/wms?service=WMS&version=1.3.0&request=GetMap&layers=$L&styles=&format=image/png&transparent=true&crs=EPSG:3857&bbox=-2226389,2875744,-1113194,3757032&width=512&height=512&time=$T"
          done
          echo "--- CORS de GetCapabilities"
          curl -s -D - -o /dev/null -H "Origin: https://canarywildfirerisk.es" "https://view.eumetsat.int/geoserver/mtg_fd/ows?service=WMS&version=1.3.0&request=GetCapabilities" | grep -i -E "access-control|content-type|HTTP/"
          echo "--- tiempo en msg_fes:wv062"
          curl -s "https://view.eumetsat.int/geoserver/msg_fes/ows?service=WMS&version=1.3.0&request=GetCapabilities" | python3 -c "import sys,re; x=sys.stdin.read(); i=x.find('<Name>wv062</Name>'); print(re.findall(r'<Dimension[^>]*name=.time.[^>]*>([^<]*)<', x[i:i+5000])[:1])"
      - name: Capturas del visor
        if: always()
        run: |
          pip install playwright
          mkdir -p /tmp/capturas docs/datos_borrascas
          cp -r /tmp/out/* docs/datos_borrascas/ || true
          (cd docs && python -m http.server 8000 >/dev/null 2>&1 &)
          sleep 2
          python .github/prueba/capturas.py
      - name: Subir capturas a rama temporal
        if: always()
        run: |
          cd /tmp/capturas && git init -q && git checkout -q -b capturas-tmp && git add . \
            && git -c user.name=bot -c user.email=bot@x commit -q -m capturas \
            && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" capturas-tmp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: salida
          path: |
            /tmp/out
            /tmp/capturas
