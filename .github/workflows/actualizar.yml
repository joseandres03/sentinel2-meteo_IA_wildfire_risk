name: Actualizacion Diaria de Riesgo IA

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
              # He eliminado la línea cache: 'pip' para forzar una instalación limpia

      - name: Instalar Dependencias del Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libspatialindex-dev libgdal-dev

      - name: Instalar Librerías de Python
        run: |
          pip install --upgrade pip
          pip install --upgrade tensorflow keras
          pip install earthengine-api geemap rasterio geopandas osmnx shapely pyproj requests matplotlib scipy joblib scikit-learn pillow geedim

      - name: Autenticar Google Earth Engine
        env:
          GEE_CREDENTIALS: ${{ secrets.GEE_CREDENTIALS }}
        run: |
          mkdir -p ~/.config/earthengine
          echo "$GEE_CREDENTIALS" > ~/.config/earthengine/credentials

      - name: Ejecutar Pipeline Predictivo
        run: python src/pipeline.py

      - name: Subir cambios automáticamente a la Web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add docs/
          git commit -m "Actualización automática: $(date +'%Y-%m-%d')" || exit 0
          git push