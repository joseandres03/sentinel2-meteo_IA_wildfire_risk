name: Trayectorias de borrascas

on:
  schedule:
    # Cada hora: comprueba qué pasadas nuevas han publicado ECMWF y NOAA
    # (00/06/12/18 UTC) y procesa solo esas. Si no hay nada nuevo, tarda ~1 min.
    - cron: '20 * * * *'
  workflow_dispatch:
    inputs:
      borrasca:
        description: 'Clave en src/borrascas/borrascas.json (vacío = todas las activas)'
        required: false
        default: ''
      modelos:
        description: 'Modelos separados por comas (vacío = los de borrascas.json)'
        required: false
        default: ''
      rehacer:
        description: 'Rehacer la trayectoria real y todas las pasadas'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: trayectorias
  cancel-in-progress: false

jobs:
  trayectorias:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '.github/workflows/trayectorias.yml'

      - name: Instalar Librerías de Python
        run: |
          pip install --upgrade pip
          pip install numpy scipy requests eccodes

      - name: Calcular trayectorias
        env:
          ECMWF_SOURCE: aws
          BORRASCA: ${{ github.event.inputs.borrasca }}
          MODELOS: ${{ github.event.inputs.modelos }}
          REHACER: ${{ github.event.inputs.rehacer }}
        run: |
          ARGS="--minutos 30"
          [ -n "$BORRASCA" ] && ARGS="$ARGS --storm $BORRASCA"
          [ -n "$MODELOS" ]  && ARGS="$ARGS --models $MODELOS"
          [ "$REHACER" = "true" ] && ARGS="$ARGS --rehacer"
          python src/trayectorias.py $ARGS

      - name: Subir cambios automáticamente a la Web
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add docs/datos_borrascas/ 2>/dev/null || exit 0
          git commit -m "Trayectorias de borrascas: $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          # por si el pipeline de riesgo ha publicado mientras tanto
          git pull --rebase origin main
          git push
