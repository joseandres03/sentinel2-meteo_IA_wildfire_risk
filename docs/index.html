<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prevención de Incendios Forestales</title>
    
    <!-- Librería Leaflet para Mapas -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Nuestro estilo personalizado (CON TRUCO ANTI-CACHÉ ?v=2) -->
    <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>

    <!-- Panel lateral flotante de controles -->
    <div id="control-panel">
        <h2>Riesgo de incendio</h2>
        <p class="subtitle">Modelo Deep Learning</p>
        
        <label for="island-select"><strong>Seleccionar isla:</strong></label>
        <select id="island-select">
            <option value="Tenerife">Tenerife</option>
            <option value="La Gomera">La Gomera</option>
            <option value="Gran Canaria">Gran Canaria</option>
            <option value="La Palma">La Palma</option>
            <option value="El Hierro">El Hierro</option>
            <option value="Lanzarote">Lanzarote</option>
            <option value="Fuerteventura">Fuerteventura</option>
        </select>

        <label for="opacity-slider" style="margin-top: 15px; display:block;"><strong>Transparencia de la capa de riesgo:</strong></label>
        <input type="range" id="opacity-slider" min="0" max="1" step="0.05" value="0.75">
        
        <!-- El contenedor vacío que nuestro app.js rellenará automáticamente con la escala AEMET -->
        <div id="legend-container"></div>
        
        <div class="info-box">
            <!-- Contenedor dinámico para las fechas -->
            <p id="update-date">Cargando telemetría...</p>
            <p style="font-size: 0.8em; color: #666; margin-top: 10px;">Datos obtenidos de AEMET y COPERNICUS</p>
        </div>
    </div>

    <!-- Contenedor del mapa a pantalla completa -->
    <div id="map"></div>
    
    <!-- Elemento flotante para el cursor -->
    <div id="tooltip"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Scripts con truco anti-caché para forzar la actualización en el navegador -->
    <script src="config.js?v=2"></script>
    <script src="app.js?v=2"></script>
</body>
</html>
