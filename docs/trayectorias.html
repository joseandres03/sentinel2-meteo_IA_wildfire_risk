<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trayectoria de borrascas · Canary Wildfire Risk</title>
    <meta name="description" content="Trayectorias previstas de borrascas y DANAs cerca de Canarias según ECMWF, AIFS, GFS y sus ensembles, con la probabilidad de paso del centro cerca de cada isla.">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="trayectorias.css?v=2" />
    <style>
        body, html { margin: 0; padding: 0; background-color: #1a1a1a; }
        body { padding: 16px; }
        @media (max-width: 600px) { body { padding: 0; } .ct-root { border-radius: 0; } }
    </style>
</head>
<body>
    <div id="trayectorias"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="trayectorias.js?v=2"></script>
    <script>
        // ?storm=<clave> para abrir directamente una borrasca concreta
        const q = new URLSearchParams(location.search);
        CanaryTracks.mount('#trayectorias', { base: 'datos_borrascas/', storm: q.get('storm') || undefined });
    </script>
</body>
</html>
